name: Build APK

on:
  push:
    # Branches: dev (daily work) -> main (kinda stable) -> playstore (releases).
    # Every branch builds an APK; a push to playstore also publishes a GitHub Release and uploads to Google Play.
    # Releases come from this same workflow so versionCode (the run number) keeps rising for Play.
    branches: [ '**' ]
    # Docs-only pushes don't need a build; a push that also touches code still builds.
    # Run it by hand from the Actions tab (workflow_dispatch) when needed.
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Java Version
        run: |
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      # Uses the Google Chrome that GitHub's Ubuntu runners come with; no browser download.
      - name: Browser tests
        run: npm run test:e2e

      - name: Sync Capacitor
        run: npx cap sync android

      # With the release key in GitHub secrets: a signed release APK (installs as an update) and a Play .aab.
      # Without it (e.g. forks): a debug APK, signed with a throwaway key as before.
      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.CNTR_KEYSTORE_BASE64 }}
          CNTR_KEYSTORE_PASSWORD: ${{ secrets.CNTR_KEYSTORE_PASSWORD }}
          CNTR_KEY_ALIAS: ${{ secrets.CNTR_KEY_ALIAS }}
          CNTR_KEY_PASSWORD: ${{ secrets.CNTR_KEYSTORE_PASSWORD }}
        run: |
          # Releases (playstore) are named exactly as package.json, e.g. 0.1.0; other builds get e.g. 0.1.0-dev.36.
          if [ "$GITHUB_REF" = refs/heads/playstore ]; then
            export VERSION_SUFFIX=""
          else
            export VERSION_SUFFIX="-${GITHUB_REF_NAME//\//-}.${BUILD_NUMBER}"
          fi
          VERSION_NAME="$(node -p "require('./package.json').version")${VERSION_SUFFIX}"
          echo "Version: ${VERSION_NAME} (versionCode ${BUILD_NUMBER})"
          cd android
          chmod +x gradlew
          mkdir -p ../dist-apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            export CNTR_KEYSTORE_FILE="$RUNNER_TEMP/cntr-release.p12"
            trap 'rm -f "$CNTR_KEYSTORE_FILE"' EXIT
            echo "$KEYSTORE_BASE64" | base64 -d > "$CNTR_KEYSTORE_FILE"
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/apk/release/CNTR_*.apk ../dist-apk/
            cp app/build/outputs/bundle/release/app-release.aab "../dist-apk/CNTR_${VERSION_NAME}.aab"
          else
            echo "::warning::No release key in secrets; building a debug APK (installing it needs an uninstall first)."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/CNTR_*.apk ../dist-apk/
          fi

      # Google Play requires native libraries (.so) aligned to 16 KB pages for apps targeting Android 15+.
      # A warning on everyday builds; a playstore build stops here instead of shipping a bundle Play would reject.
      - name: Check 16 KB page alignment
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign"
          for apk in dist-apk/CNTR_*.apk; do
            if "$ZIPALIGN" -c -P 16 -v 4 "$apk" > zipalign.log 2>&1; then
              echo "$apk: native libraries are 16 KB aligned"
            else
              grep -E '\.so' zipalign.log | grep -v 'OK' | head -20 || true
              if [[ "$GITHUB_REF" == refs/heads/playstore ]]; then
                echo "::error::$apk is not 16 KB page aligned; Google Play would reject it."
                exit 1
              fi
              echo "::warning::$apk is not 16 KB page aligned; fix before a Play release."
            fi
          done

      # archive: false uploads each file itself (no zip), so the .apk opens straight on a phone.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist-apk/CNTR_*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Play bundle
        if: hashFiles('dist-apk/*.aab') != ''
        uses: actions/upload-artifact@v7
        with:
          path: dist-apk/CNTR_*.aab
          archive: false

  # On a push to playstore: a permanent GitHub Release (tag v<version>) with the signed APK (for testers) and the .aab.
  release:
    needs: build
    if: github.ref == 'refs/heads/playstore'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          pattern: 'CNTR_*'
          path: release
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          aab="$(ls release/CNTR_*.aab 2>/dev/null | head -1)"
          if [ -z "$aab" ]; then
            echo "::error::No signed .aab: add the release key secrets (CNTR_KEYSTORE_*) before tagging a release."
            exit 1
          fi
          name="$(basename "$aab" .aab)"   # CNTR_<package.json version>, e.g. CNTR_0.1.0
          # One release per version: bump "version" in package.json before the next release, or this stops
          # here because the release already exists (a pushed tag of the same name is reused).
          gh release create "v${name#CNTR_}" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "${name/_/ }" --generate-notes

  # On a push to playstore: the .aab goes to a Google Play track. Skipped until the PLAY_SERVICE_ACCOUNT_JSON secret exists.
  # Play only accepts API uploads once the app exists in Play Console with one bundle uploaded by hand.
  # Track and status come from repository variables (Settings > Variables): PLAY_TRACK (default internal)
  # and PLAY_RELEASE_STATUS (default draft, which Play requires until the app has been published once).
  play:
    needs: build
    if: github.ref == 'refs/heads/playstore'
    runs-on: ubuntu-24.04
    steps:
      - name: Check for Play credentials
        id: creds
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret; skipping the Google Play upload."
          fi

      - name: Download the bundle
        if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: 'CNTR_*.aab'
          path: release
          merge-multiple: true

      - name: Upload to Google Play
        if: steps.creds.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cntr.app
          releaseFiles: release/CNTR_*.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
