name: Feature request
description: Suggest an idea or a change to how CNTR works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation at your booth or event, not just the solution.
      placeholder: When the line gets long, I can't …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds or other apps you use.
  - type: checkboxes
    id: offline
    attributes:
      label: Offline check
      options:
        - label: This works without internet access (CNTR is offline by design).
          required: true
