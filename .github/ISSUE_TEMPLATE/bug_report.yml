name: Bug report
description: Something in CNTR doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include real sales data, names or anything private.
        Security problems go through the [security policy](../blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Sell
        2. Tap …
        3. …
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Was any data lost or changed?
      options:
        - "No"
        - "Yes (sales, products, events or expenses)"
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: 0.1.34
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 7, Android 15
  - type: dropdown
    id: settings
    attributes:
      label: Language and theme
      multiple: true
      options:
        - English
        - Bahasa Indonesia
        - Light theme
        - Dark theme
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images in here. Blur anything private.
